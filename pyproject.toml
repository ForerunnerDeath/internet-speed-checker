[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "internet-speed-checker"
version = "0.1.0"
description = "CLI utility for measuring HTTP download speed."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
]


[project.scripts]
speedcheck = "speedcheck.__main__:main"


[project.optional-dependencies]
dev = [
    "basedpyright>=1.20",
    "build>=1.2",
    "pytest>=8,<10",
    "ruff>=0.8",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
target-version = "py311"
line-length = 100


[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "e2e: tests that require external network access",
]


[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = [
    "src",
    "tests",
]
